name: c1 image validation

# Track A / A2 — Linux Docker image validation for the c1 listener and daemon.
# Triggers follow tests.yml convention A: pull_request + push-to-main only, so a PR
# branch runs once per SHA (a feature-branch push would duplicate the pull_request run).
# Not a required merge check. Parent re-runs via workflow_dispatch and reads logs.
on:
  pull_request:
    paths:
      - "deploy/**"
      - ".dockerignore"
      - "ops/c1_rail/**"
      - "ops/c1_signal_daemon/**"
      - "core/**"
      - "scripts/validate_c1_monitoring_acceptance.py"
      - "docs/notes/rail_build/M1_MONITORING_ACCEPTANCE.json"
      - "tests/ops/**"
      - "tests/conftest.py"
      - "tests/rail_crosstrade/**"
      - "tests/test_validate_c1_monitoring_acceptance.py"
      - "tests/test_rail_goldenpath_crosstrade.py"
      - "lab/analysis/c1/q_rail_1_2026-07/f2_floors.json"
      - "docs/notes/2026-07-06-crosstrade-nt8-payload-sufficiency-matrix.md"
      - "tests/fixtures/c1_image_validation/**"
      - "requirements-ops.lock"
      - "pyproject.toml"
      - "scripts/c1_image_validation.sh"
      - ".github/workflows/c1-image-validation.yml"
  push:
    branches:
      - main
    paths:
      - "deploy/**"
      - ".dockerignore"
      - "ops/c1_rail/**"
      - "ops/c1_signal_daemon/**"
      - "core/**"
      - "scripts/validate_c1_monitoring_acceptance.py"
      - "docs/notes/rail_build/M1_MONITORING_ACCEPTANCE.json"
      - "tests/ops/**"
      - "tests/conftest.py"
      - "tests/rail_crosstrade/**"
      - "tests/test_validate_c1_monitoring_acceptance.py"
      - "tests/test_rail_goldenpath_crosstrade.py"
      - "lab/analysis/c1/q_rail_1_2026-07/f2_floors.json"
      - "docs/notes/2026-07-06-crosstrade-nt8-payload-sufficiency-matrix.md"
      - "tests/fixtures/c1_image_validation/**"
      - "requirements-ops.lock"
      - "pyproject.toml"
      - "scripts/c1_image_validation.sh"
      - ".github/workflows/c1-image-validation.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # One matrix job, one leg per image; `name` keeps the check names `listener`
  # and `daemon` that the two former copies of this block produced.
  image:
    name: ${{ matrix.service }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false  # the two images are independent verdicts
      matrix:
        service: [listener, daemon]
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: Cache pip wheels (ops lock)
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: ~/.cache/pip
          key: c1-image-val-pip-${{ hashFiles('requirements-ops.lock') }}
          restore-keys: |
            c1-image-val-pip-
      - name: Validate ${{ matrix.service }} image
        run: ./scripts/c1_image_validation.sh ${{ matrix.service }}
      - name: Upload ${{ matrix.service }} logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: c1-image-validation-${{ matrix.service }}
          # Curated evidence only — bind-mount *_data dirs are root-owned and
          # break upload-artifact zip creation when included wholesale.
          path: |
            /tmp/c1_image_validation/*.log
            /tmp/c1_image_validation/*.status
            /tmp/c1_image_validation/*.arm
            /tmp/c1_image_validation/*.second
            /tmp/c1_image_validation/*.txt
            /tmp/c1_image_validation/*.err
            /tmp/c1_image_validation/*.out
            /tmp/c1_image_validation/*.assert
            /tmp/c1_image_validation/*.events
            /tmp/c1_image_validation/*.state
            /tmp/c1_image_validation/*.get
            /tmp/c1_image_validation/*.plan
            /tmp/c1_image_validation/*.apply
            /tmp/c1_image_validation/*.health
            /tmp/c1_image_validation/*.py
            /tmp/c1_image_validation/*.cid
          if-no-files-found: warn
