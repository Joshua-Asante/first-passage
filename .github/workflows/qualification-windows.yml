name: Qualification unit tests (Windows)

# Every other workflow runs on ubuntu, while the operator develops and verifies
# on Windows (fp.ps1) and cloud agents on Linux. Linux-only assumptions in the
# qualification harness and its tests (argument shapes, POSIX runtime paths)
# were found by people, not CI: 2a00902 (container Env as a dict, a 9/15 S2
# run) and the #461 fixture (host interpreter paths reaching g5_unit_spec,
# all five tests failing on Windows). This job runs the platform-independent
# qualification suite on windows-latest; the Linux-only boundary and
# supervision files live under tests/integration and are not selected here.
# brief-authoring check 12 states the rule; this job is its mechanical guard.
#
# Not a required merge check (main requires `skills (3.12)` only).

on:
  pull_request:
    paths:
      - "ops/c1_rail/**"
      - "ops/c1_signal_daemon/**"
      - "core/**"
      - "tests/ops/qualification/**"
      - "tests/ops/test_phase3_provenance_acceptance.py"
      - "requirements-ops.lock"
      - "tools/local_verification/requirements-extra.txt"
      - ".github/workflows/qualification-windows.yml"
  workflow_dispatch:
    inputs:
      selection:
        description: "Optional pytest node ids or paths (space-separated) instead of the full qualification selection"
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  group: qualification-windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  qualification-windows:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: Set up Python 3.11 + locked deps
        uses: ./.github/actions/setup-locked-python
        with:
          python-version: "3.11"
      - name: Install shared verification dependencies
        shell: bash
        run: python -m pip install -r tools/local_verification/requirements-extra.txt
      # The same selection the full-suite bridge runs in its clean child
      # (tests/ops/test_qualification_isolation.py): an explicit qualification
      # selection keeps ordinary collection (tests/ops/conftest.py), serial.
      - name: Run qualification unit tests
        shell: bash
        env:
          # Free text from a dispatch: read from the environment, never
          # interpolated into the script.
          SELECTION: ${{ inputs.selection || '' }}
        run: |
          set -euo pipefail
          if [ -n "$SELECTION" ]; then
            read -r -a targets <<< "$SELECTION"
          else
            targets=(tests/ops/qualification tests/ops/test_phase3_provenance_acceptance.py)
          fi
          python -m pytest "${targets[@]}" -n 0 -rs \
            --junitxml="$RUNNER_TEMP/qualification-windows/junit.xml"
      - name: Retain junit
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: qualification-windows-junit
          path: ${{ runner.temp }}/qualification-windows/
          if-no-files-found: warn
          retention-days: 14
