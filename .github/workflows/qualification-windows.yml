name: Qualification unit tests (Windows)

# Every other workflow runs on ubuntu, while the operator develops and verifies
# on Windows (fp.ps1) and cloud agents on Linux. Linux-only assumptions in the
# qualification harness and its tests (argument shapes, POSIX runtime paths)
# were found by people, not CI: 2a00902 (container Env as a dict, a 9/15 S2
# run) and the #461 fixture (host interpreter paths reaching g5_unit_spec,
# all five tests failing on Windows). This job runs the platform-independent
# qualification suite on windows-latest; the Linux-only boundary and
# supervision files live under tests/integration and are not selected here.
# brief-authoring check 12 states the rule; this job is its mechanical guard.
#
# Not a required merge check (main requires `skills (3.12)` only).
#
# Sharded 2026-10-03: the serial selection outgrew the 90 min job ceiling
# (77 min of test time at the last success, cancelled at 90 min afterwards), so
# the suite now runs as four file shards (`qualification-windows-shard`,
# timeout 60) and the verdict is the aggregate `qualification-windows` job,
# which also checks coverage: the four shard collections must sum to the whole
# selection's collection, and each shard's junit testcase count must equal its
# own collected count, so a file dropped or doubled between shards fails the
# check instead of passing silently.

on:
  pull_request:
    paths:
      - "ops/c1_rail/**"
      - "ops/c1_signal_daemon/**"
      - "core/**"
      - "tests/ops/qualification/**"
      - "tests/ops/test_phase3_provenance_acceptance.py"
      - "requirements-ops.lock"
      - "tools/local_verification/requirements-extra.txt"
      - ".github/workflows/qualification-windows.yml"
  workflow_dispatch:
    inputs:
      selection:
        description: "Optional pytest node ids or paths (space-separated) instead of the full qualification selection"
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  group: qualification-windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  qualification-windows-shard:
    name: qualification-windows shard ${{ matrix.shard }}
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    env:
      SHARD: ${{ matrix.shard }}
      # Free text from a dispatch: read from the environment, never
      # interpolated into the script.
      SELECTION: ${{ inputs.selection || '' }}
    # The whole selection needed 77 min of serial test time at the 2026-10-02
    # success and then overran this job's old 90 min ceiling; the largest single
    # file is ~7 min. Four file shards (selected below) are ~20 min of test time
    # each, so 60 leaves margin for runner variance and the collection passes.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: Set up Python 3.11 + locked deps
        uses: ./.github/actions/setup-locked-python
        with:
          python-version: "3.11"
      - name: Install shared verification dependencies
        shell: bash
        run: python -m pip install -r tools/local_verification/requirements-extra.txt
      # Shard by file, round-robin over the sorted whole selection, so adding or
      # removing one file moves at most one file between shards. Explicit file
      # paths only: tests/ops/conftest.py keeps ordinary collection when every
      # selection is under tests/ops/qualification or is the provenance file, and
      # treats -k/--ignore/--deselect or node ids (`::`) as focused runs.
      - name: Select this shard's files
        shell: bash
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/qualification-windows"
          mkdir -p "$out"
          if [ -n "$SELECTION" ]; then
            echo "selection dispatch: shard 0 runs the selection itself; no shard selection"
            exit 0
          fi
          python - "$SHARD" "$out/shard-$SHARD.txt" <<'PY'
          import pathlib
          import sys
          shard = int(sys.argv[1])
          files = sorted(
              p.as_posix()
              for p in pathlib.Path("tests/ops/qualification").rglob("test_*.py")
              if p.is_file()
          ) + ["tests/ops/test_phase3_provenance_acceptance.py"]
          files = sorted(files)
          mine = files[shard::4]
          pathlib.Path(sys.argv[2]).write_text(
              "".join(name + "\n" for name in mine), encoding="utf-8")
          print(f"shard {shard}: {len(mine)} of {len(files)} selection files")
          for name in mine:
              print(f"  {name}")
          PY
      # Coverage evidence, collected before the run it describes: the aggregate
      # job compares the shard counts with the whole selection's count and with
      # the junit files, so a shard that quietly selects less than its files
      # fails there instead of green-lighting a partial suite.
      - name: Record collected-test counts
        shell: bash
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/qualification-windows"
          if [ -n "$SELECTION" ]; then
            echo "selection dispatch: no shard coverage evidence (aggregate comparison skipped)"
            exit 0
          fi
          mapfile -t targets < "$out/shard-$SHARD.txt"
          python -m pytest "${targets[@]}" --collect-only -q -n 0 > "$out/collect-$SHARD.log" 2>&1 \n            || { tail -n 40 "$out/collect-$SHARD.log"; exit 1; }
          if [ "$SHARD" = "0" ]; then
            python -m pytest tests/ops/qualification \
              tests/ops/test_phase3_provenance_acceptance.py \
              --collect-only -q -n 0 > "$out/collect-full.log" 2>&1 \n              || { tail -n 40 "$out/collect-full.log"; exit 1; }
          fi
          python - "$out" "$SHARD" <<'PY'
          import pathlib
          import re
          import sys
          out = pathlib.Path(sys.argv[1])
          shard = sys.argv[2]

          def tail(text, lines=5):
              return "\n".join(text.splitlines()[-lines:])

          def collected(log):
              # pytest's final summary line, e.g. "1234 tests collected in 5.2s"
              # (and "no tests collected in 0.1s"); anything else is a refusal.
              text = log.read_text(encoding="utf-8", errors="replace")
              numbers = re.findall(
                  r"(?m)^\s*(?:=+\s*)?(\d+) tests? collected\b", text)
              if not numbers and re.search(r"(?m)^\s*no tests collected\b", text):
                  return 0
              if not numbers:
                  sys.stderr.write(f"cannot parse a collected-test count from {log}:\n{tail(text)}\n")
                  sys.exit(1)
              return int(numbers[-1])

          count = collected(out / f"collect-{shard}.log")
          (out / f"count-{shard}.txt").write_text(f"{count}\n", encoding="utf-8")
          print(f"shard {shard}: {count} tests collected")
          if shard == "0":
              whole = collected(out / "collect-full.log")
              (out / "count-full.txt").write_text(f"{whole}\n", encoding="utf-8")
              print(f"whole selection: {whole} tests collected")
          PY
      # The same selection the full-suite bridge runs in its clean child
      # (tests/ops/test_qualification_isolation.py): an explicit qualification
      # selection keeps ordinary collection (tests/ops/conftest.py), serial.
      - name: Run qualification unit tests
        shell: bash
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/qualification-windows"
          mkdir -p "$out"
          if [ -n "$SELECTION" ]; then
            if [ "$SHARD" != "0" ]; then
              echo "selection dispatch: shard 0 runs it, shards 1-3 do nothing"
              exit 0
            fi
            read -r -a targets <<< "$SELECTION"
          else
            mapfile -t targets < "$out/shard-$SHARD.txt"
          fi
          python -m pytest "${targets[@]}" -n 0 -rs \
            --junitxml="$out/junit-$SHARD.xml"
      - name: Retain shard evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: qualification-windows-shard-${{ matrix.shard }}
          path: ${{ runner.temp }}/qualification-windows/
          if-no-files-found: warn
          retention-days: 14

  # The verdict, and the check name merge procedures reference: the shards only
  # supply evidence, so this job re-publishes their outcome under one name and
  # refuses a green result when a shard was lost between them.
  qualification-windows:
    name: qualification-windows
    runs-on: ubuntu-latest
    needs: qualification-windows-shard
    if: always()
    timeout-minutes: 10
    steps:
      - name: Require every shard to have succeeded
        run: |
          set -euo pipefail
          result="${{ needs.qualification-windows-shard.result }}"
          echo "qualification-windows-shard result: $result"
          if [ "$result" != "success" ]; then
            echo "not every shard succeeded; failing qualification-windows" >&2
            exit 1
          fi
      - name: Download shard evidence
        if: ${{ (inputs.selection || '') == '' }}
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: qualification-windows-shard-*
          path: ${{ runner.temp }}/qualification-windows-shards/
      - name: Check shard coverage against the whole selection
        if: ${{ (inputs.selection || '') == '' }}
        run: |
          set -euo pipefail
          python3 - "$RUNNER_TEMP/qualification-windows-shards" <<'PY'
          import pathlib
          import sys
          import xml.etree.ElementTree as ET
          root = pathlib.Path(sys.argv[1])

          def read_int(path):
              try:
                  return int(path.read_text(encoding="utf-8").strip())
              except FileNotFoundError:
                  sys.exit(f"missing evidence file: {path}")

          def junit_testcases(path):
              try:
                  xml = ET.parse(path).getroot()
              except FileNotFoundError:
                  sys.exit(f"missing evidence file: {path}")
              return sum(1 for el in xml.iter()
                         if el.tag.rsplit("}", 1)[-1] == "testcase")

          shards = [str(i) for i in range(4)]
          rows = []
          for shard in shards:
              base = root / f"qualification-windows-shard-{shard}"
              rows.append((shard, read_int(base / f"count-{shard}.txt"),
                           junit_testcases(base / f"junit-{shard}.xml")))
          whole = read_int(root / "qualification-windows-shard-0" / "count-full.txt")
          total = sum(count for _, count, _ in rows)
          print("shard  collected  junit")
          for shard, count, cases in rows:
              print(f"  {shard}    {count:9d} {cases:6d}")
          print(f"  sum  {total:11d}")
          print(f"  full {whole:11d}")
          problems = []
          if total != whole:
              problems.append(
                  f"shards collected {total} tests but the whole selection collected {whole}")
          for shard, count, cases in rows:
              if count != cases:
                  problems.append(
                      f"shard {shard}: junit holds {cases} testcases for {count} collected tests")
          if problems:
              for problem in problems:
                  print(f"FAIL: {problem}", file=sys.stderr)
              sys.exit(1)
          print("shard coverage equals the whole selection")
          PY
      - name: Selection dispatch ran on shard 0
        if: ${{ (inputs.selection || '') != '' }}
        run: |
          echo "selection dispatch: shard 0 ran the selection; no coverage comparison"
