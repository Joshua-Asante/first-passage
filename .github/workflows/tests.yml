name: Tests

# A: pull_request + push-to-main only (no feature-branch push).
# D: skip markdown / .claude-only PRs (keep in sync with pylint.yml).
#    A mixed docs+code PR still runs — paths-ignore skips only when
#    every changed file matches.
on:
  pull_request:
    paths-ignore:
      - "**/*.md"
      - ".claude/**"
  push:
    branches:
      - main
    paths-ignore:
      - "**/*.md"
      - ".claude/**"

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11"]
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: Set up Python ${{ matrix.python-version }} + locked deps
        uses: ./.github/actions/setup-locked-python
        with:
          python-version: ${{ matrix.python-version }}
          ripgrep: "true"  # msl_preflight dedup requires `rg` on PATH
      - name: Install shared verification dependencies
        run: python -m pip install -r tools/local_verification/requirements-extra.txt
      # check_boundaries.py lives in scripts/gates.yml (always) and runs via
      # gate-manifest.yml --tier check (W5 H6 land). Do not re-list it here.
      # --junitxml keeps per-test timings for the parent run; the qualification
      # bridge (tests/ops/test_qualification_isolation.py) derives its child's
      # report root from the parent's xmlpath, so the child's junit.xml and
      # output.log land beside it. Before 2026-09-19 both were discarded and CI
      # had no per-test evidence for the 18-25 min child.
      - name: Run pytest
        run: pytest tests/ -v --junitxml="$RUNNER_TEMP/pytest-evidence/junit.xml"
      - name: Retain pytest evidence (parent junit, qualification child junit/output)
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: pytest-evidence-${{ matrix.python-version }}
          path: ${{ runner.temp }}/pytest-evidence/
          if-no-files-found: warn
          retention-days: 14

  # lab/ research-guardrail job moved to validation-controls.yml
  # (path-filtered to lab/ and its shared core/metadata/ops-lock dependencies).
