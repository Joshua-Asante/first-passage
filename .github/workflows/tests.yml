name: Tests

# A: pull_request + push-to-main only (no feature-branch push).
# D: skip markdown / .claude-only PRs (keep in sync with pylint.yml).
#    A mixed docs+code PR still runs — paths-ignore skips only when
#    every changed file matches.
on:
  pull_request:
    paths-ignore:
      - "**/*.md"
      - ".claude/**"
  push:
    branches:
      - main
    paths-ignore:
      - "**/*.md"
      - ".claude/**"

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package + all optional deps
        run: python -m pip install --require-hashes -r requirements-ops.lock
      - name: Check import boundaries (ADR 2026-06-05 layer contract)
        run: python scripts/check_boundaries.py
      - name: Install ripgrep
        # msl_preflight dedup requires `rg` on PATH; ubuntu-latest does not ship it.
        run: sudo apt-get update && sudo apt-get install -y ripgrep
      - name: Run pytest
        run: pytest tests/ -v

  # Research-guardrail + R&D-pipeline self-tests across lab/: analysis sanity
  # controls, parked codification lint controls. Gen-1 validation harness retired
  # 2026-07-11 (ADR 2026-07-11-gen1-pipeline-retirement); self-test generators
  # moved to tests/test_validation_selftest.py in the main pytest job.
  #
  # Gen-1 leftover / manual-PYTHONPATH camps are --ignore'd (evidence kept,
  # NON-RUNNABLE under generic `pytest lab/` — see REPO_MAP + each camp README):
  #   - lab/archive/gbpusd_rank_cert (Great Prune moved body off analysis/; still
  #     imports retired `validation.*`)
  #   - legacy/guardian_parity_2026-06-23, legacy/usoil_regime_capture
  #   - mnq_selection_ceiling_allbars (imports pruned sibling run_selection)
  #   - archive transfer/envelope/funnel/p2_diff/harv_0 camps (cross-camp sys.path /
  #     floor_scan / roll_mask path drift, or optional parquet engine not in
  #     requirements-ops.lock — run from their own dirs if needed)
  #
  # Basename collisions: hyphenated camp slugs (…_2026-08) are not valid Python
  # packages, so empty __init__.py alone cannot uniquify shared test_*.py names
  # under prepend. This job uses --import-mode=importlib; camps load siblings via
  # research_utils.camp_import.load_camp_sibling. Still ship empty __init__.py at
  # scaffold time (lab/CATALOG.md camp-layout note).
  #
  # COVERAGE BOUNDARY (intentional, not a gap): this job runs the lab/ *tests*
  # (incl. analysis/decompound_remc_2026-06-07/test_decompound.py and the other
  # analysis gates). It does NOT run the quarterly decompound regime-trigger
  # script (lab/analysis/decompound_remc_2026-06-07/regime_gate.py) — slow MC
  # over a trailing-6-month window. The former time_to_pass.py --regime-check
  # quarterly duty was RETIRED 2026-07-22 (D2 resolved — harness retained on
  # disk; do not schedule; owner:
  # docs/adr/2026-07-11-challenge-era-claims-rescope.md §Addendum 2026-07-22).
  # Any remaining 08-08 Decompound-HOLD A5 limb is an operator-sequenced
  # falsifier (not CI; prune brief Packet F) — CI makes no coverage claim.

  validation-controls:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Install package + all optional deps
        run: python -m pip install --require-hashes -r requirements-ops.lock
      - name: Run lab/ controls (analysis + parked codification)
        run: |
          pytest lab/ -v --import-mode=importlib \
            --ignore=lab/archive/gbpusd_rank_cert \
            --ignore=lab/analysis/legacy/guardian_parity_2026-06-23 \
            --ignore=lab/analysis/legacy/usoil_regime_capture \
            --ignore=lab/analysis/c1/mnq_selection_ceiling_allbars_2026-08 \
            --ignore=lab/archive/transfer_expression_grid_2026-08 \
            --ignore=lab/archive/tnec_envelope_compile_2026-08 \
            --ignore=lab/archive/q_funnel_1_2026-07 \
            --ignore=lab/archive/p2_replay_2026-07/test_p2_diff_k2.py \
            --ignore=lab/archive/p2_replay_2026-07/test_p2_diff_k2_tolerant.py \
            --ignore=lab/archive/harv_0_month_end_rebalance_es_2026-07
