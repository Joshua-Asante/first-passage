name: Tests

# A: pull_request + push-to-main only (no feature-branch push).
# D: skip markdown / .claude-only PRs (keep in sync with pylint.yml).
#    A mixed docs+code PR still runs — paths-ignore skips only when
#    every changed file matches.
on:
  pull_request:
    paths-ignore:
      - "**/*.md"
      - ".claude/**"
  push:
    branches:
      - main
    paths-ignore:
      - "**/*.md"
      - ".claude/**"

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11"]
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package + all optional deps
        run: python -m pip install --require-hashes -r requirements-ops.lock
      # check_boundaries.py lives in scripts/gates.yml (always) and runs via
      # gate-manifest.yml --tier check (W5 H6 land). Do not re-list it here.
      - name: Install ripgrep
        # msl_preflight dedup requires `rg` on PATH; ubuntu-latest does not ship it.
        run: sudo apt-get update && sudo apt-get install -y ripgrep
      - name: Run pytest
        run: pytest tests/ -v

  # lab/ research-guardrail job moved to validation-controls.yml
  # (path-filtered to lab/; W5 addendum 2026-08-15).
