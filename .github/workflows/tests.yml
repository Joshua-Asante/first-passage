name: Tests

# A: pull_request + push-to-main only (no feature-branch push).
# D: skip markdown / .claude-only PRs (keep in sync with pylint.yml).
#    A mixed docs+code PR still runs — paths-ignore skips only when
#    every changed file matches.
on:
  pull_request:
    paths-ignore:
      - "**/*.md"
      - ".claude/**"
  push:
    branches:
      - main
    paths-ignore:
      - "**/*.md"
      - ".claude/**"

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11"]
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: Set up Python ${{ matrix.python-version }} + locked deps
        uses: ./.github/actions/setup-locked-python
        with:
          python-version: ${{ matrix.python-version }}
          ripgrep: "true"  # msl_preflight dedup requires `rg` on PATH
      - name: Install signed qualification test dependency
        run: python -m pip install cryptography==50.0.1
      # check_boundaries.py lives in scripts/gates.yml (always) and runs via
      # gate-manifest.yml --tier check (W5 H6 land). Do not re-list it here.
      - name: Run pytest
        run: pytest tests/ -v

  # lab/ research-guardrail job moved to validation-controls.yml
  # (path-filtered to lab/ and its shared core/metadata/ops-lock dependencies).
