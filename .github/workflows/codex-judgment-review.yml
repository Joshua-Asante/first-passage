# Automatic Codex second-opinion review for judgment-heavy PRs.
# Owner: docs/adr/2026-07-14-cc-cursor-surface-allocation.md addendum
# 2026-08-23 (automatic judgment review), retargeted from Claude to Codex by
# the addendum dated 2026-08-29.
# Review-only. Does not merge.
#
# Unlike claude-judgment-review.yml's predecessor (which posted an `@claude`
# mention picked up by claude-code-action's GitHub-App listener in
# claude.yml), Codex has no such listener — there is nothing to mention.
# This workflow runs `codex exec review` directly in the same job and posts
# its output as the PR comment. That also sidesteps the reason the old
# workflow needed a two-hop dance: anthropics/claude-code-action self-skips
# on any PR that edits .github/workflows/, which does not apply here.
#
# Fires once per PR (HTML marker). Re-review is a fresh push after deleting
# the marker comment, or an operator/cursor comment.
# Drafts are silent; ready_for_review is the first look.
# pull_request (not pull_request_target).
#
# Adversarial mode (2026-08-29 addendum follow-up): label `adversarial-review`
# or body token `codex-review: adversarial` hands Codex the fable-judge
# skill as its review prompt instead of the default pass, for a high-stakes
# PR where the extra scrutiny is worth it. Still review-only, still
# read-only sandbox — findings route to Cursor via notify-cursor.yml to
# implement, per operator ruling (Codex does not get write access here).

name: Codex judgment review

on:
  pull_request:
    types: [opened, ready_for_review, reopened, labeled]

concurrency:
  group: codex-judgment-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  codex-review:
    if: >
      github.event.pull_request.draft == false &&
      (github.event.action != 'labeled' ||
       github.event.label.name == 'codex-review' ||
       github.event.label.name == 'adversarial-review')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Fetch base branch
        run: git fetch --no-tags origin "${{ github.event.pull_request.base.ref }}"

      - name: Collect PR context
        env:
          GH_TOKEN: ${{ github.token }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          set -euo pipefail
          printf '%s' "${PR_BODY}" > /tmp/pr-body
          gh api --paginate \
            "repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}/files" \
            --jq '.[].filename' > /tmp/changed-files
          gh api --paginate \
            "repos/${{ github.repository }}/issues/${{ github.event.pull_request.number }}/comments" \
            --jq '.[].body // empty' > /tmp/comments

      - name: Decide
        id: decide
        env:
          HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
          EVENT_ACTION: ${{ github.event.action }}
          EVENT_LABEL: ${{ github.event.label.name || '' }}
          PR_LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
        run: |
          python3 scripts/check_codex_judgment_review.py \
            --head-branch "$HEAD_BRANCH" \
            --draft false \
            --labels "$PR_LABELS" \
            --body-file /tmp/pr-body \
            --changed-files-file /tmp/changed-files \
            --existing-comments-file /tmp/comments \
            --event-action "$EVENT_ACTION" \
            --event-label "$EVENT_LABEL"

      - name: Install Codex CLI
        if: steps.decide.outputs.trigger == 'yes'
        run: npm install -g @openai/codex

      # Draws from the ChatGPT/Codex subscription entitlement (a device-auth
      # access token), mirroring how claude.yml draws from the Claude
      # Max/Pro subscription rather than separate metered API billing.
      # Generate the token locally with `codex login --device-auth`, then
      # extract the access token codex stores under `$CODEX_HOME/auth.json`
      # and save it as the CODEX_ACCESS_TOKEN repo secret (rotate as needed;
      # unlike claude setup-token this is not a fixed-lifetime grant, follow
      # whatever expiry Codex reports).
      #
      # To use metered API billing instead, swap this step's run line for:
      #   printenv OPENAI_API_KEY | codex login --with-api-key
      # and reference secrets.OPENAI_API_KEY instead.
      - name: Authenticate Codex
        if: steps.decide.outputs.trigger == 'yes'
        env:
          CODEX_ACCESS_TOKEN: ${{ secrets.CODEX_ACCESS_TOKEN }}
        run: printenv CODEX_ACCESS_TOKEN | codex login --with-access-token

      # Adversarial mode swaps in the fable-judge skill as a custom review
      # prompt (piped over stdin — `codex exec review -`). Standard mode
      # passes no prompt at all and gets Codex's own default review pass.
      - name: Run Codex review
        if: steps.decide.outputs.trigger == 'yes'
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          ADVERSARIAL: ${{ steps.decide.outputs.adversarial }}
        run: |
          set -euo pipefail
          BASE="origin/${{ github.event.pull_request.base.ref }}"
          if [ "$ADVERSARIAL" = "yes" ]; then
            {
              echo "You are Codex, performing a second-opinion adversarial review of this PR's diff — standing in for the fable-judge skill below (docs/adr/2026-07-14-cc-cursor-surface-allocation.md addendum 2026-08-29). Judging changes nothing: report findings only, do not edit any files."
              echo
              sed -n '/^# fable-judge/,$p' .claude/skills/fable-judge/SKILL.md
            } > /tmp/codex-review-prompt.md
            codex exec review - \
              --base "$BASE" \
              --title "$PR_TITLE" \
              --sandbox read-only \
              --output-last-message /tmp/codex-review.md \
              < /tmp/codex-review-prompt.md
          else
            codex exec review \
              --base "$BASE" \
              --title "$PR_TITLE" \
              --sandbox read-only \
              --output-last-message /tmp/codex-review.md
          fi

      - name: Post Codex review
        if: steps.decide.outputs.trigger == 'yes'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REASON: ${{ steps.decide.outputs.reason }}
          ADVERSARIAL: ${{ steps.decide.outputs.adversarial }}
        run: |
          set -euo pipefail
          if [ "$ADVERSARIAL" = "yes" ]; then
            KIND="adversarial second-opinion review (fable-judge mode)"
          else
            KIND="second-opinion review"
          fi
          {
            echo "**Codex $KIND** — automated (\`codex exec review\`), review-only, not merge authority. Reason: \`$REASON\`. Owner: \`docs/adr/2026-07-14-cc-cursor-surface-allocation.md\` addendum 2026-08-29."
            echo
            cat /tmp/codex-review.md
            echo
            echo '<!-- codex-judgment-review -->'
          } > /tmp/codex-review-comment.md
          gh pr comment "$PR_NUMBER" --body-file /tmp/codex-review-comment.md
