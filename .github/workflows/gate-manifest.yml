name: Gate manifest

# A: pull_request + push-to-main only (no feature-branch push).
# Always runs — docs PRs must still hit the composition battery (W5).
# Composition owner: scripts/gates.yml via scripts/gate_manifest.py --tier check.
# Do not hand-duplicate the gate list here.
on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  gate-manifest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: Set up Python 3.11
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
      - name: Install package + ops lock
        run: python -m pip install --require-hashes -r requirements-ops.lock
      - name: Install ripgrep
        run: sudo apt-get update && sudo apt-get install -y ripgrep
      - name: Run gates.yml --tier check
        run: python scripts/gate_manifest.py --tier check
