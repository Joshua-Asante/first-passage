name: Gate manifest

# W5: derive the hard-gate battery from scripts/gates.yml via
# `python scripts/gate_manifest.py --tier check` (H6 HOLD lifted 2026-08-23).
# Job id stays `skills` + matrix 3.12 so the existing main-protection ruleset
# required check `skills (3.12)` (Q-GATESTACK-1 Limb-A addendum) keeps firing.
# Companions that are not gates.yml ids stay in their own workflows
# (manifest-check pine-pin-provenance --base, validation-controls lab pytest,
# pylint, tests.yml pytest). This land does not change the ruleset itself.
#
# A: pull_request + push-to-main only (same as the former skills-check.yml).
# Docs PRs must still run this job — composition authority, not a path filter.
on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  skills:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12"]
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0
      - name: Fetch origin/main for sessions-append-only merge-base
        run: git fetch --no-tags origin main
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package + all optional deps
        run: python -m pip install --require-hashes -r requirements-ops.lock
      - name: Install ripgrep
        # Some gates (and their transitive callers) expect `rg` on PATH;
        # ubuntu-latest does not ship it.
        run: sudo apt-get update && sudo apt-get install -y ripgrep
      - name: Run gates.yml composition (--tier check)
        run: python scripts/gate_manifest.py --tier check
