name: Notify Cursor of Claude/Codex Review

on:
  issue_comment:
    types: [created]
  pull_request_review:
    types: [submitted]

jobs:
  ping-cursor:
    # Fires once Claude's own review/comment lands (claude[bot]), so Cursor's Cloud
    # Agent — which only acts when explicitly mentioned (docs: comment "@cursor" on a
    # PR/issue to kick off an agent) — picks it up without a human relaying it.
    # Deliberately unscoped to "was this review cursor-requested": pinging @cursor on
    # a PR it didn't open is a harmless no-op for it, not worth an extra API call to avoid.
    #
    # Also fires on the Codex second-opinion review posted by
    # codex-judgment-review.yml. Codex has no GitHub-App bot identity here —
    # it posts as github-actions[bot] via `gh pr comment` — so that comment
    # is matched by its `<!-- codex-judgment-review -->` marker instead of a
    # bot login (docs/adr/2026-07-14-cc-cursor-surface-allocation.md
    # addendum 2026-08-29).
    if: |
      (github.event_name == 'issue_comment' && github.event.issue.pull_request != null && github.event.comment.user.login == 'claude[bot]' && !contains(github.event.comment.body, 'Claude Code review — in progress')) ||
      (github.event_name == 'pull_request_review' && github.event.review.user.login == 'claude[bot]') ||
      (github.event_name == 'issue_comment' && github.event.issue.pull_request != null && github.event.comment.user.login == 'github-actions[bot]' && contains(github.event.comment.body, '<!-- codex-judgment-review -->'))
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      issues: write
    steps:
      - name: Comment @cursor so its GitHub bot picks up the finished review
        uses: actions/github-script@v7
        with:
          script: |
            const number = context.payload.pull_request?.number ?? context.payload.issue?.number;
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: number,
              body: "@cursor the review above is complete — please address any findings.",
            });
