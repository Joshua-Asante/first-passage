# Automatic Claude review request for judgment-heavy PRs.
# Owner: docs/adr/2026-07-14-cc-cursor-surface-allocation.md addendum 2026-08-23.
# Review-only. Does not merge. Does not replace @claude on comments (claude.yml).
#
# Fires once per PR (HTML marker). Re-review is the existing @claude mention.
# Drafts are silent; ready_for_review is the first look.
# pull_request (not pull_request_target). allowed_bots is an explicit list,
# never '*'. Fork PRs do not receive CLAUDE_CODE_OAUTH_TOKEN.

name: Claude judgment review

on:
  pull_request:
    types: [opened, ready_for_review, reopened, labeled]

concurrency:
  group: claude-judgment-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  request-review:
    if: >
      github.event.pull_request.draft == false &&
      (github.event.action != 'labeled' ||
       github.event.label.name == 'claude-review')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: write
      id-token: write
      actions: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Collect PR context
        env:
          GH_TOKEN: ${{ github.token }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          set -euo pipefail
          printf '%s' "${PR_BODY}" > /tmp/pr-body
          gh api --paginate \
            "repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}/files" \
            --jq '.[].filename' > /tmp/changed-files
          gh api --paginate \
            "repos/${{ github.repository }}/issues/${{ github.event.pull_request.number }}/comments" \
            --jq '.[].body // empty' > /tmp/comments

      - name: Decide
        id: decide
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 scripts/check_claude_judgment_review.py \
            --head-branch "${{ github.event.pull_request.head.ref }}" \
            --draft false \
            --labels "${{ join(github.event.pull_request.labels.*.name, ',') }}" \
            --body-file /tmp/pr-body \
            --changed-files-file /tmp/changed-files \
            --existing-comments-file /tmp/comments \
            --event-action "${{ github.event.action }}" \
            --event-label "${{ github.event.label.name || '' }}"

      - name: Record request
        if: steps.decide.outputs.trigger == 'yes'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh pr comment "${{ github.event.pull_request.number }}" --body "$(cat <<'EOF'
          Automatic Claude judgment review requested (`REASON` from the predicate is recorded on the workflow run).

          This is review-only. It does not merge and does not replace operator / Claude Code adjudication on the auto-merge-forbidden surface. Re-review: comment `@claude` (or add the `claude-review` label after deleting this marker).

          <!-- claude-judgment-review -->
          EOF
          )"

      - name: Run Claude Code review
        if: steps.decide.outputs.trigger == 'yes'
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # Cursor cloud agents open these PRs; the mention workflow already
          # allow-lists the same App. Do not use '*'.
          allowed_bots: "cursor"
          prompt: |
            Review this pull request as the Claude Code adjudication pass
            for a judgment-heavy change that was scoped on Cursor first
            (or explicitly opted in via the `claude-review` label /
            `claude-review: judgment` body token).

            Owner ADR: docs/adr/2026-07-14-cc-cursor-surface-allocation.md
            (2026-08-23 addendum — automatic judgment review). Sibling
            auto-merge ADR is out of scope: do not merge.

            Adjudicate:
            1. Does the change hold under the owners it cites?
            2. Did it skip a Claude Code freeze the 2026-07-14 routing
               test required (doctrine / locked-surface authored on Cursor
               without a frozen spec)?
            3. Any silent restatement of a prior finding (blast-radius)?

            Do not expand scope. Do not push commits unless the operator
            later asks via @claude. Post the review on this PR.
          claude_args: |
            --model claude-sonnet-5
