name: Claude Code

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened, assigned]
  pull_request_review:
    types: [submitted]

jobs:
  claude:
    if: |
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude')) ||
      (github.event_name == 'issues' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')))
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read # Required for Claude to read CI results on PRs
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Run Claude Code
        id: claude
        uses: anthropics/claude-code-action@v1
        with:
          # Draws from the Claude Max/Pro subscription's included usage rather than
          # separate metered API billing. Generate with `claude setup-token` (valid
          # 1 year) and store as the CLAUDE_CODE_OAUTH_TOKEN repo secret.
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}

          # allowed_bots is deliberately ABSENT. The key existed solely to admit
          # cursor[bot], whose comments claude-code-action otherwise refuses as a
          # non-human actor; Cursor was retired as a worker surface on 2026-09-15
          # (docs/adr/2026-07-14-cc-cursor-surface-allocation.md, Revision
          # 2026-09-15), so that caller is gone. github-actions was dropped the
          # same way on 2026-08-29 once its `@claude`-mention flow retired.
          # Omitting the key restores the default — human actors only — rather
          # than leaving unused standing scope allow-listed. Never use '*'.
          # Codex's review integration is account-level and never mentions
          # `@claude`, so it needs no entry. Re-add a specific bot here only when
          # a real bot-originated `@claude` mention exists to admit.

          # Optional: Customize the trigger phrase (default: @claude)
          # trigger_phrase: "/claude"

          # Optional: Trigger when specific user is assigned to an issue
          # assignee_trigger: "claude-bot"

          # Optional: Configure Claude's behavior with CLI arguments (e.g. --max-turns 10,
          # --allowedTools "Bash(npm install),Bash(npm run build)", --system-prompt "...")
          # --allowedTools *appends*; GitHub/Read/Grep stay. Default Bash is only
          # git add|commit|push|rm, but the action system prompt tells Claude to
          # run git diff/log/status — those were denied until the run died
          # (PR #145 run 32683209126, 12 permission denials). Quote the value:
          # unquoted Bash(git diff:*) is split on spaces (action issue #844).
          claude_args: |
            --model claude-sonnet-5
            --allowedTools "Bash(git diff:*),Bash(git log:*),Bash(git status:*)"

          # Optional: Advanced settings configuration
          # settings: |
          #   {
          #     "env": {
          #       "NODE_ENV": "test"
          #     }
          #   }
