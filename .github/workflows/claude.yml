name: Claude Code

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened, assigned]
  pull_request_review:
    types: [submitted]

jobs:
  claude:
    if: |
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude')) ||
      (github.event_name == 'issues' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')))
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read # Required for Claude to read CI results on PRs
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Run Claude Code
        id: claude
        uses: anthropics/claude-code-action@v1
        with:
          # Draws from the Claude Max/Pro subscription's included usage rather than
          # separate metered API billing. Generate with `claude setup-token` (valid
          # 1 year) and store as the CLAUDE_CODE_OAUTH_TOKEN repo secret.
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}

          # Cursor's PR/review comments come from the cursor[bot] GitHub App, which
          # claude-code-action otherwise refuses as a non-human actor (fails fast,
          # after the ack reaction, with no Claude run ever starting).
          # Do not use '*'. The mention workflow on the default branch is what
          # actually runs Claude, so a PR that edits workflows still gets a look.
          #
          # github-actions was previously also allow-listed: it was the
          # commenter for automatic judgment-review requests
          # (claude-judgment-review.yml posted `@claude` + a marker). That
          # flow was retargeted to Codex by the 2026-08-29 addendum to
          # docs/adr/2026-07-14-cc-cursor-surface-allocation.md —
          # codex-judgment-review.yml runs `codex exec review` directly and
          # never mentions `@claude`, so github-actions has no remaining
          # caller here. Dropped rather than left as unused standing scope;
          # re-add if a future github-actions-originated `@claude` mention is
          # introduced.
          allowed_bots: "cursor"

          # Optional: Customize the trigger phrase (default: @claude)
          # trigger_phrase: "/claude"

          # Optional: Trigger when specific user is assigned to an issue
          # assignee_trigger: "claude-bot"

          # Optional: Configure Claude's behavior with CLI arguments (e.g. --max-turns 10,
          # --allowedTools "Bash(npm install),Bash(npm run build)", --system-prompt "...")
          # --allowedTools *appends*; GitHub/Read/Grep stay. Default Bash is only
          # git add|commit|push|rm, but the action system prompt tells Claude to
          # run git diff/log/status — those were denied until the run died
          # (PR #145 run 32683209126, 12 permission denials). Quote the value:
          # unquoted Bash(git diff:*) is split on spaces (action issue #844).
          claude_args: |
            --model claude-sonnet-5
            --allowedTools "Bash(git diff:*),Bash(git log:*),Bash(git status:*)"

          # Optional: Advanced settings configuration
          # settings: |
          #   {
          #     "env": {
          #       "NODE_ENV": "test"
          #     }
          #   }
