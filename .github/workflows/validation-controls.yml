name: Validation controls

# Run the lab consumer suite for its sources and shared dependency inputs.
# Unrelated docs/scripts and the separate research environment do not trigger it.
# core/** also includes core documentation. This remains a non-required job.
# Pull requests and pushes to main use the same dependency predicate.
on:
  pull_request:
    paths:
      - "lab/**"
      - "core/**"
      - "pyproject.toml"
      - "requirements-ops.lock"
      - ".github/workflows/validation-controls.yml"
  push:
    branches:
      - main
    paths:
      - "lab/**"
      - "core/**"
      - "pyproject.toml"
      - "requirements-ops.lock"
      - ".github/workflows/validation-controls.yml"

permissions:
  contents: read

jobs:
  # Research-guardrail + R&D-pipeline self-tests across lab/: analysis sanity
  # controls, parked codification lint controls. Gen-1 validation harness retired
  # 2026-07-11 (ADR 2026-07-11-gen1-pipeline-retirement); self-test generators
  # moved to tests/test_validation_selftest.py in the main pytest job.
  #
  # Retain exclusions for present archive camps with specialized environments:
  # transfer_expression_grid uses cross-camp/manual imports; dl2_m6a_pdhpdl
  # used the separate Databento research stack. Neither currently carries
  # runnable tests, but restoring a body must not silently enroll it here.
  # Historical tests and nine absent exclusion paths have been pruned.
  #
  # Basename collisions: hyphenated camp slugs (..._2026-08) are not valid Python
  # packages, so empty __init__.py alone cannot uniquify shared test_*.py names
  # under prepend. This job uses --import-mode=importlib; camps load siblings via
  # research_utils.camp_import.load_camp_sibling. Still ship empty __init__.py at
  # scaffold time (lab/CATALOG.md camp-layout note).
  #
  # This job runs checked-in lab tests only, not research campaigns or MC runs.
  # Scheduling on core changes does not itself establish consumer coverage;
  # the replay implementation must supply tests that exercise its dependencies.

  validation-controls:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: Set up Python 3.11
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
      - name: Install package + all optional deps
        run: python -m pip install --require-hashes -r requirements-ops.lock
      - name: Run lab/ controls (analysis + parked codification)
        run: |
          pytest lab/ -v --import-mode=importlib \
            --ignore=lab/archive/transfer_expression_grid_2026-08 \
            --ignore=lab/archive/dl2_m6a_pdhpdl_2026-08-22
