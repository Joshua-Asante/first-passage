name: Skills Check

# A: pull_request + push-to-main only (no feature-branch push).
# Always runs — this is the cheap pre-commit backstop on docs PRs too.
on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  # Gate scripts once in CI as the pre-commit backstop; test execution lives in
  # tests.yml — operator ruling 2026-07-24 (Algorithm review #5).
  skills:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12"]
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package + all optional deps
        run: python -m pip install --require-hashes -r requirements-ops.lock
      - name: Skill path-reference linter
        run: python scripts/check_skill_refs.py --all
      - name: Methodology-skill no-constants guard
        run: python scripts/check_skills_no_constants.py
      - name: Committed-path liveness (MANIFEST parent dirs resolve on disk)
        run: python scripts/check_path_liveness.py
      - name: Status consistency (CATALOG <-> ledgers <-> rejected_candidates)
        run: python scripts/check_status_consistency.py
      - name: ADR lifecycle graph (headers + derived INDEX)
        run: python scripts/check_adr_graph.py
      - name: lab/CATALOG.md freshness (generated index matches scan)
        run: python scripts/archive_lab_analysis.py --check --catalog-only
      - name: Instrument profiles (blocks + vocabulary + generated view)
        run: python scripts/instrument_profiles.py check
