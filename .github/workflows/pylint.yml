name: Pylint

# A: pull_request + push-to-main only (no feature-branch push).
# D: skip markdown / .claude-only PRs (keep in sync with tests.yml).
#    A mixed docs+code PR still runs — paths-ignore skips only when
#    every changed file matches.
on:
  pull_request:
    paths-ignore:
      - "**/*.md"
      - ".claude/**"
  push:
    branches:
      - main
    paths-ignore:
      - "**/*.md"
      - ".claude/**"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # C: one Python. Pylint is not version-sensitive enough here to
        # pay a second 6-min job (2026-07-24 note left the dual matrix
        # for weak astroid sensitivity; CI diet overrides).
        python-version: ["3.11"]
    steps:
    - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install package + pylint
      run: python -m pip install --require-hashes -r requirements-ops.lock
    - name: Lint
      # --fail-under=8.0 calibrated against current codebase score (8.35/10
      # locally with deps installed). Bar moves up when the score does;
      # for now this catches regressions below the established baseline
      # without blocking on the existing style debt that pre-dates pyproject.
      run: pylint --fail-under=8.0 $(git ls-files '*.py')
