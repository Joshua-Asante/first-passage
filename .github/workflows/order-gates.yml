name: Order gates

# The Order's enforcement check, isolated (docs/framework/the-order.md, E5).
# It runs the stdlib-only scripts/check_order.py with the runner's own Python before
# anything else from the repository executes: no setup action, no dependency install,
# no other gate. So nothing outside this file, the checker and CODEOWNERS (all
# code-owned) can tamper with it. The same check also runs inside `skills (3.12)`;
# this job is the one to require on main.
on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  order-gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Fetch the target branch for the merge-base
        run: git fetch --no-tags origin "+refs/heads/${GITHUB_BASE_REF:-main}:refs/remotes/origin/${GITHUB_BASE_REF:-main}"
      - name: Run check_order.py (stdlib only, isolated interpreter)
        run: python3 -I scripts/check_order.py
