# One owner for Python setup in CI: setup-python at the requested version, then
# the hash-pinned requirements-ops.lock install. Optional ripgrep (ubuntu-latest
# does not ship it; some gates/tests expect `rg` on PATH). Checkout first.
name: Set up locked Python
description: setup-python + hash-pinned requirements-ops.lock install (+ optional ripgrep)
inputs:
  python-version:
    required: true
  ripgrep:
    required: false
    default: "false"
runs:
  using: composite
  steps:
    - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
      with:
        python-version: ${{ inputs.python-version }}
    - name: Install package + all optional deps
      shell: bash
      run: python -m pip install --require-hashes -r requirements-ops.lock
    - name: Install ripgrep
      if: ${{ inputs.ripgrep == 'true' }}
      shell: bash
      run: sudo apt-get update && sudo apt-get install -y ripgrep
