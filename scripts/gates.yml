# Gate composition authority — W5 ADR docs/adr/2026-08-07-w5-governance-diet.md
# Consumed by scripts/gate_manifest.py. Pre-commit + Make call the runner;
# do not hand-duplicate this list in the shell hook.
#
# tiers:
#   always            — every pre-commit invocation (when selected)
#   path-conditional  — pre-commit only when staged paths match
#                       when.staged_regex; still runs on `make check`
#   data-conditional  — only when staged paths match when.staged_regex
#   soft              — optional / warn-tier (not in default pre-commit)
#                       ⚠ 2026-08-08: `soft` is declared here but is NOT an accepted
#                       `--tier` value in gate_manifest.py, and every selector drops it.
#                       A gate landed as tier=soft therefore runs in NO tier — it is
#                       silently disabled, not merely deferred. Do not use `soft` until
#                       it has a caller. Currently zero gates use it (verified).

version: 1

gates:
  - id: skills-no-constants
    tier: always
    cmd:
      - python
      - scripts/check_skills_no_constants.py

  - id: skill-refs
    tier: always
    cmd:
      - python
      - scripts/check_skill_refs.py
      - --all

  - id: data-manifests
    tier: data-conditional
    when:
      staged_regex: '^core/data/(tv_exports|bar_data|external)/'
    cmd:
      - python
      - scripts/check_data_manifests.py
      - --check

  # WARN-tier / report-only (exits 0 regardless of findings — see the script's
  # own docstring). data-conditional per PR #716's proposed tier: docs/pursuits/
  # changes are rare enough that "runs only when staged" beats path-conditional's
  # unconditional inclusion in `make check`; do not use tier: soft (dead, no caller — see header).
  - id: pursuit-records
    tier: data-conditional
    when:
      staged_regex: '^docs/pursuits/'
    cmd:
      - python
      - scripts/check_pursuit_records.py

  - id: pine-manifest
    tier: always
    cmd:
      - python
      - scripts/check_pine_manifest.py

  - id: pine-pin-provenance
    tier: always
    cmd:
      - python
      - scripts/check_pine_manifest.py
      - --check-pin-provenance

  - id: boundaries
    tier: always
    cmd:
      - python
      - scripts/check_boundaries.py

  # 2026-08-15 (governance-belt audit action 3): reverted from path-conditional.
  # Both gates detect dead LINKS — the violation fires just as easily by
  # deleting/moving the link TARGET as by editing the link itself, and no
  # staged_regex here ever matched lab/|core/|ops/, so a commit that moved a
  # lab/analysis/ body out from under a root-doc link skipped this check at
  # pre-commit. See docs/adr/2026-08-07-w5-governance-diet.md Addendum
  # 2026-08-15 for the runtime cost measured before reverting (~0.7s + ~1.4s).
  - id: path-liveness
    tier: always
    cmd:
      - python
      - scripts/check_path_liveness.py

  - id: root-doc-liveness
    tier: always
    cmd:
      - python
      - scripts/check_root_doc_liveness.py

  - id: status-consistency
    tier: path-conditional
    when:
      staged_regex: '^(lab/CATALOG[.]md|docs/rejected_candidates[.]md|ops/instruments/)'
    cmd:
      - python
      - scripts/check_status_consistency.py

  - id: adr-graph
    tier: path-conditional
    when:
      staged_regex: '^docs/adr/'
    cmd:
      - python
      - scripts/check_adr_graph.py

  - id: lab-catalog
    tier: path-conditional
    when:
      staged_regex: '^(lab/)'
    cmd:
      - python
      - scripts/archive_lab_analysis.py
      - --check
      - --catalog-only

  - id: instrument-profiles
    tier: path-conditional
    when:
      staged_regex: '^ops/instruments/'
    cmd:
      - python
      - scripts/instrument_profiles.py
      - check

  - id: sessions-order
    tier: path-conditional
    when:
      staged_regex: '^docs/SESSIONS[.]md$'
    cmd:
      - python
      - scripts/roll_sessions.py
      - --check-order

  - id: sessions-append-only
    tier: path-conditional
    when:
      staged_regex: '^docs/SESSIONS[.]md$'
    cmd:
      - python
      - scripts/roll_sessions.py
      - --check-append-only

  - id: sessions-queue-bind
    tier: path-conditional
    when:
      staged_regex: '^docs/SESSIONS[.]md$'
    cmd:
      - python
      - scripts/check_sessions_queue_bind.py

  - id: supersession-placement
    tier: path-conditional
    when:
      staged_regex: '^docs/adr/'
    cmd:
      - python
      - scripts/check_supersession_placement.py

  - id: closure-disposition
    tier: path-conditional
    when:
      staged_regex: '^(docs/briefs/closures/|docs/briefs/INDEX[.]md|lab/CATALOG[.]md)'
    cmd:
      - python
      - scripts/check_closure_disposition.py

  # Report-only INDEX/CATALOG liveness census (always exit 0). Phase 5b —
  # path-conditional so make check still runs it; INDEX moves stay judgment.
  # Not W5 leftover C-P5-04 / H6 (CI composition).
  - id: sync-liveness
    tier: path-conditional
    when:
      staged_regex: '^(docs/briefs/INDEX[.]md|lab/CATALOG[.]md)'
    cmd:
      - python
      - scripts/sync_liveness_indexes.py

  # Rejects stray C0 controls (esp. form-feed) in union-merge / high-traffic
  # governance prose — 2026-08-11 SESSIONS repair-hook double-damage incident.
  - id: governance-prose-control-chars
    tier: path-conditional
    when:
      staged_regex: '^(docs/SESSIONS[.]md|docs/rejected_candidates[.]md|docs/mc_anchor_history[.]md)'
    cmd:
      - python
      - scripts/check_governance_prose_control_chars.py
