# Gate composition authority — W5 ADR docs/adr/2026-08-07-w5-governance-diet.md
# Consumed by scripts/gate_manifest.py. Pre-commit + Make call the runner;
# do not hand-duplicate this list in the shell hook.
#
# tiers:
#   always            — every pre-commit invocation (when selected)
#   path-conditional  — pre-commit only when staged paths match
#                       when.staged_regex; still runs on `make check`
#   data-conditional  — only when staged paths match when.staged_regex
#   audit             — report-only diagnostics, run explicitly by `make audit`;
#                       excluded from pre-commit and required CI because a command
#                       that cannot fail cannot protect a merge

version: 1

gates:
  - id: skills-no-constants
    tier: always
    cmd:
      - python
      - scripts/check_skills_no_constants.py

  - id: skill-refs
    tier: always
    cmd:
      - python
      - scripts/check_skill_refs.py
      - --all

  - id: data-manifests
    tier: data-conditional
    when:
      staged_regex: '^core/data/(tv_exports|bar_data|external)/'
    cmd:
      - python
      - scripts/check_data_manifests.py
      - --check

  # pursuit-records retired 2026-08-24 (Rule 16 R5 — docs/operational_rules.md;
  # docs/adr/2026-08-24-validation-battery-k-tiering-and-gate-retirement.md):
  # scripts/check_pursuit_records.py always exits 0 as invoked, so this entry
  # could never fail regardless of tier — unfalsifiable ceremony, deletable
  # even when signed. Script retained on disk, runnable manually.

  - id: pine-manifest
    tier: always
    cmd:
      - python
      - scripts/check_pine_manifest.py

  - id: pine-pin-provenance
    tier: always
    cmd:
      - python
      - scripts/check_pine_manifest.py
      - --check-pin-provenance

  - id: boundaries
    tier: always
    cmd:
      - python
      - scripts/check_boundaries.py

  # 2026-08-15 (governance-belt audit action 3): reverted from path-conditional.
  # Both gates detect dead LINKS — the violation fires just as easily by
  # deleting/moving the link TARGET as by editing the link itself, and no
  # staged_regex here ever matched lab/|core/|ops/, so a commit that moved a
  # lab/analysis/ body out from under a root-doc link skipped this check at
  # pre-commit. See docs/adr/2026-08-07-w5-governance-diet.md Addendum
  # 2026-08-15 for the runtime cost measured before reverting (~0.7s + ~1.4s).
  - id: path-liveness
    tier: always
    cmd:
      - python
      - scripts/check_path_liveness.py

  - id: root-doc-liveness
    tier: always
    cmd:
      - python
      - scripts/check_root_doc_liveness.py

  - id: status-consistency
    tier: path-conditional
    when:
      staged_regex: '^(lab/CATALOG[.]md|docs/rejected_candidates[.]md|ops/instruments/)'
    cmd:
      - python
      - scripts/check_status_consistency.py

  # STATE.md is included so A7 (a forward-trigger bullet citing a superseded
  # ADR without naming the successor) is reachable from a STATE.md-only edit,
  # not just a docs/adr/ edit -- A7 checks STATE.md's own citations, and a
  # STATE.md bullet can drift stale without any ADR file being touched.
  - id: adr-graph
    tier: path-conditional
    when:
      staged_regex: '^(docs/adr/|STATE[.]md$)'
    cmd:
      - python
      - scripts/check_adr_graph.py

  - id: lab-catalog
    tier: path-conditional
    when:
      staged_regex: '^(lab/)'
    cmd:
      - python
      - scripts/archive_lab_analysis.py
      - --check
      - --catalog-only

  # SSOT Phase 3 — intra-cost_model commission-set partition. Bind only after
  # a clean live run (2026-08-29). Does not join ops/instruments ledgers.
  - id: cost-model-closed-world
    tier: path-conditional
    when:
      staged_regex: '^(lab/discovery/cost_model[.]py|tests/test_cost_model[.]py|scripts/check_cost_model_closed_world[.]py)$'
    cmd:
      - python
      - scripts/check_cost_model_closed_world.py

  - id: instrument-profiles
    tier: path-conditional
    when:
      staged_regex: '^ops/instruments/'
    cmd:
      - python
      - scripts/instrument_profiles.py
      - check

  - id: sessions-order
    tier: path-conditional
    when:
      staged_regex: '^docs/SESSIONS[.]md$'
    cmd:
      - python
      - scripts/roll_sessions.py
      - --check-order

  - id: sessions-append-only
    tier: path-conditional
    when:
      staged_regex: '^docs/SESSIONS[.]md$'
    cmd:
      - python
      - scripts/roll_sessions.py
      - --check-append-only

  - id: sessions-queue-bind
    tier: path-conditional
    when:
      staged_regex: '^docs/SESSIONS[.]md$'
    cmd:
      - python
      - scripts/check_sessions_queue_bind.py

  # always, not path-conditional on STATE.md: a stale Last curated / weekly
  # deadline must fail the next unrelated commit (the daily digest is skipped).
  # Clock is America/New_York; tests inject STATE_CURRENCY_TODAY.
  - id: state-currency
    tier: always
    cmd:
      - python
      - scripts/check_state_currency.py

  # Trigger must match check_supersession_placement.py's own in_scope() -- the
  # checker never scans docs/adr/ (see its SCOPE docstring), so a docs/adr/
  # trigger let this gate run on edits it could never find anything in, while
  # never running on the two doc classes it actually inspects.
  - id: supersession-placement
    tier: path-conditional
    when:
      staged_regex: '^(docs/notes/rail_build/[^/]*DESK_CARD[^/]*[.]md$|lab/analysis/.*/RESULTS[^/]*[.]md$)'
    cmd:
      - python
      - scripts/check_supersession_placement.py

  - id: closure-disposition
    tier: path-conditional
    when:
      staged_regex: '^(docs/briefs/closures/|docs/briefs/INDEX[.]md|lab/CATALOG[.]md)'
    cmd:
      - python
      - scripts/check_closure_disposition.py

  # D4 enforcement instrument (docs/adr/2026-08-09-rejection-register-topology-
  # and-bar-wiring.md, dispatched as a separate packet at ratification): does
  # every terminal-negative closure naming one instrument have a DEAD row in
  # that instrument's ops/instruments/<SYM>.md? WARN-tier initially, per the
  # same M-22 lesson check_falsifier_reachability.py's own docstring cites (a
  # hard gate would block commits on a real-corpus baseline that is not clean
  # today -- see that script's own real-corpus run). This repo's gates.yml has
  # no functioning "warn" tier (see the tiers note at the top of this file --
  # `soft` is declared but never actually runs); `--exit-zero` is this gate's
  # own way of staying WARN while still executing at path-conditional, same
  # posture check_instrument_ledger_coverage.py's docstring names ("gate
  # composition is owned by scripts/gates.yml, not decided [in the script]").
  # Promote by dropping --exit-zero once the real-corpus run is clean or every
  # remaining gap carries a dated, named exception.
  - id: instrument-rejection-coverage
    tier: audit
    cmd:
      - python
      - scripts/check_instrument_rejection_coverage.py
      - --exit-zero

  # Report-only INDEX/CATALOG liveness census (always exit 0). INDEX moves
  # stay judgment; run it at the explicit audit cadence.
  - id: sync-liveness
    tier: audit
    cmd:
      - python
      - scripts/sync_liveness_indexes.py

  - id: lifecycle-consistency
    tier: path-conditional
    when:
      staged_regex: '^(core/lifecycle[.]py|CLAUDE[.]md|[.]claude/skills/c1-rail/SKILL[.]md|docs/methodology/strategy_lifecycle[.]md|docs/pursuits/|ops/instruments/|ops/venue_editions/)'
    cmd:
      - python
      - scripts/check_lifecycle_consistency.py

  # Report-only docs-as-runtime inbound index (P3). Always exit 0; audit only.
  - id: docs-runtime-inventory
    tier: audit
    cmd:
      - python
      - scripts/check_docs_runtime_inventory.py
      - --check

  # HARD: check_boundaries layer maps must match scripts/repo_map_layers.yml (P5).
  - id: repo-map-layers
    tier: path-conditional
    when:
      staged_regex: '^(REPO_MAP[.]md|scripts/check_boundaries[.]py|scripts/repo_map_layers[.]yml|scripts/check_repo_map_layers[.]py)$'
    cmd:
      - python
      - scripts/check_repo_map_layers.py

  # Rejects stray C0 controls (esp. form-feed) in union-merge / high-traffic
  # governance prose — 2026-08-11 SESSIONS repair-hook double-damage incident.
  - id: governance-prose-control-chars
    tier: path-conditional
    when:
      staged_regex: '^(docs/SESSIONS[.]md|docs/rejected_candidates[.]md|docs/mc_anchor_history[.]md)'
    cmd:
      - python
      - scripts/check_governance_prose_control_chars.py

  # docs/adr/2026-08-27-ssot-data-lineage-remediation-program.md Phase 1
  # Task 1: closes the class of defect sync_skills.py --check cannot see
  # (a skill script an ADR Verification block cites that never existed on
  # EITHER side of the repo->deployed sync boundary — concretely,
  # ~/.claude/skills/brief-authoring/scripts/check_brief.py, per that ADR's
  # §0 Step 1/2). Cheap (grep + existence check, no deploy), so `always`
  # rather than path-conditional.
  #
  # 2026-08-28 review fix (Critical): on a machine with NO ~/.claude/skills/
  # deploy target at all -- every GitHub Actions runner, any fresh clone;
  # there is no skills-deploy step in .github/workflows/, by design -- the
  # checker now SKIPS (prints "SKIP ... NOT CHECKED", exits 0) instead of
  # hard-failing. The prior behavior red-lined the sole required CI check
  # (`skills (3.12)`) on every future PR, forever, for a property of the
  # local machine rather than the commit. It still exits 1 when a real
  # deploy target exists locally and the cited script is genuinely missing
  # from it -- see scripts/check_skill_deploy_sync.py's own docstring and
  # tests/scripts/test_check_skill_deploy_sync.py.
  - id: skill-deploy-sync
    tier: always
    cmd:
      - python
      - scripts/check_skill_deploy_sync.py

  # Deployed-vs-main skew is useful at audit time, but normal drift cannot
  # reject a commit. Hard M1 enforcement remains in the deploy/arm path.
  - id: m1-tree-skew
    tier: audit
    cmd:
      - python
      - scripts/validate_c1_monitoring_acceptance.py
      - docs/notes/rail_build/M1_MONITORING_ACCEPTANCE.json
      - --check-tree-skew

  # Quarterly coverage trend; deliberately report-only until its corpus baseline
  # is clean enough to support a meaningful failure verdict.
  - id: falsifier-reachability-census
    tier: audit
    cmd:
      - python
      - scripts/check_falsifier_reachability.py
      - --stats

  # Notice-log K-vs-DSR diagnostic; report-only.
  - id: notice-grade-k-correction
    tier: audit
    cmd:
      - python
      - scripts/audit_notice_grade_k_correction.py

  # Known-dirty spec-provenance heuristic; report-only.
  - id: spec-provenance
    tier: audit
    cmd:
      - python
      - scripts/check_spec_provenance.py
      - --stats

  # Quarterly Rule-2 checkpoint diagnostic; report-only.
  - id: rule2-trip-log-liveness
    tier: audit
    cmd:
      - python
      - scripts/check_rule2_trip_log_liveness.py
      - --stats
