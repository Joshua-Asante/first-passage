# Gate composition: scripts/gate_manifest.py runs these for pre-commit, `make check`
# and CI (the `skills (3.12)` job). Tiers: always | path-conditional |
# data-conditional | audit (report-only). Keep only gates that protect code, data
# integrity or the money controls.

version: 1

gates:
  - id: evidence-store
    tier: path-conditional
    when:
      staged_regex: '^(scripts/evidence_store/|tests/evidence_store/|scripts/gates[.]yml)'
    cmd:
      - python
      - -m
      - unittest
      - discover
      - -s
      - tests/evidence_store
      - -p
      - test_*.py

  - id: data-manifests
    tier: data-conditional
    when:
      staged_regex: '^core/data/(tv_exports|bar_data|external)/'
    cmd:
      - python
      - scripts/check_data_manifests.py
      - --check

  - id: pine-manifest
    tier: always
    cmd:
      - python
      - scripts/check_pine_manifest.py

  - id: pine-pin-provenance
    tier: always
    cmd:
      - python
      - scripts/check_pine_manifest.py
      - --check-pin-provenance

  - id: card-pins
    tier: always
    cmd:
      - python
      - scripts/check_pine_manifest.py
      - --check-card-pins

  - id: durable-store-pragmas
    tier: path-conditional
    when:
      staged_regex: '^(ops/|scripts/check_durable_store_pragmas[.]py|tests/test_check_durable_store_pragmas[.]py|scripts/gates[.]yml)'
    cmd:
      - python
      - scripts/check_durable_store_pragmas.py

  - id: boundaries
    tier: always
    cmd:
      - python
      - scripts/check_boundaries.py

  - id: cost-model-closed-world
    tier: path-conditional
    when:
      staged_regex: '^(core/instrument_specs[.]py|lab/discovery/cost_model[.]py|tests/test_cost_model[.]py|scripts/check_cost_model_closed_world[.]py)$'
    cmd:
      - python
      - scripts/check_cost_model_closed_world.py

  - id: m1-artifact-structure
    tier: always
    cmd:
      - python
      - scripts/validate_c1_monitoring_acceptance.py
      - docs/notes/rail_build/M1_MONITORING_ACCEPTANCE.json

  - id: staged-debris
    tier: always
    cmd:
      - python
      - scripts/check_staged_debris.py
