# Track B status register — the Rule 7 owner of each Track B item's current status.
#
# One row per Track B item: status now, the next permitted action and who takes it,
# blockers, expiry, and the dated record that set the status. The rulings' text,
# reasoning and evidence stay with the record each row cites (operator ruling
# 2026-10-03; docs/operational_rules.md Rule 7 owner table).
#
# Who writes a row: whoever records the ruling or acceptance, in the same change
# (the gate refuses a new dated heading in a watched owner without a citing row).
# After editing, run `python scripts/track_b_register.py write` to regenerate the
# blocks listed under `generated`, then `... check` (gate `track-b-register`).
# `... digest` is the session-start summary (SessionStart hook).
#
# Falsifier (STATE forward trigger 2026-10-17): if Track B mirror/propagation
# commits have not fallen by at least half from the 2026-09-27..10-02 baseline (17),
# or STATE/checklist status drifts from the ledger again, retire the register
# rather than add rules to it.
#
# Row fields
#   id          <kind>.<name>; kind is one of packet, slice, gate, work, checkpoint,
#               drill, defect, t00, adapter, parked. Namespaced so the overloaded
#               names (R1 vs R-1, D1, S1, C1 ...) cannot collide.
#   aliases     other names the owner documents use for the same item (T04 = S5).
#   status      NOT_STARTED | OPEN | IN_PROGRESS | AWAITING_OPERATOR | BLOCKED |
#               ACCEPTED | ACCEPTED_LIMITED | CLOSED | PARKED.
#   since       date the current status was set (YYYY-MM-DD).
#   owner       repository-relative link (from this directory) to the heading that
#               set the status; must resolve.
#   next        the next permitted action, or null when nothing is owed.
#   next_actor  operator | coordinator | worker | none.
#   blocked_by  register ids that must reach a terminal status first.
#   checkpoint  the checkpoint.* row that authorizes the next action, if any.
#   expires     ISO datetime with zone for an approval or window that lapses.
#   evidence    further owner links (each counts as citing that heading).
#   refs        free text: PRs, commits, branches (not checked).
#   note        one line, only where the status needs a scope limit to be read right.
#
# Coverage (rule R5): every heading dated on or after `covers_from` in a `watch` file
# must be cited by some row's owner/evidence or listed under `noted`. Add or update a
# row in the same change that adds a dated ruling or acceptance.
#
# Grants nothing: no row authorizes an act; the owners and the operator do.

